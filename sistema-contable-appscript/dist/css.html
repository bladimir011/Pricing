<style>
:root{--uni:#8b1e2d;--uni2:#5d101b;--soft:#f8ecef;--bg:#f4f6f8;--ink:#172033;--muted:#667085;--line:#e4e7ec;--card:#fff;--green:#137a4a;--amber:#a96300;--red:#ba2d3f;--blue:#2459a9;--shadow:0 8px 28px rgba(16,24,40,.08)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.right{text-align:right}

/* Login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(420px,1.1fr) minmax(360px,.9fr);background:#fff}
.login-left{background:linear-gradient(145deg,var(--uni2),var(--uni));color:#fff;padding:64px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-left:before,.login-left:after{content:"";position:absolute;border-radius:50%;border:70px solid rgba(255,255,255,.06)}
.login-left:before{width:500px;height:500px;right:-260px;top:-220px}
.login-left:after{width:360px;height:360px;left:-180px;bottom:-190px}
.brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.brand-mark{width:64px;height:64px;border:2px solid currentColor;border-radius:14px;display:grid;place-items:center;font-weight:900;letter-spacing:.08em;font-size:23px}
.brand-title{font-weight:900;font-size:24px}
.brand-sub{font-size:13px;opacity:.78;margin-top:3px}
.login-copy{position:relative;z-index:1;max-width:580px}
.login-copy h1{font-size:44px;line-height:1.06;margin:14px 0 15px}
.login-copy p{font-size:16px;line-height:1.65;opacity:.9;margin:0}
.login-footer{font-size:12px;opacity:.72;position:relative;z-index:1}
.login-right{display:grid;place-items:center;padding:42px}
.login-card{width:min(440px,100%)}
.login-card h2{font-size:32px;margin:0 0 8px}
.login-card>p{color:var(--muted);margin:0 0 28px}
.demo-box{margin-top:18px;border:1px solid #ead7db;background:#fff8f9;border-radius:10px;padding:13px;font-size:13px;line-height:1.6}
.error{background:#fdecec;color:#a31f31;border:1px solid #f4c8ce;padding:10px 12px;border-radius:8px;margin-bottom:14px;font-size:13px}

/* Formularios */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:11px;font-weight:800;color:#475467}
.field input,.field select,.field textarea{width:100%;border:1px solid #d0d5dd;background:#fff;border-radius:8px;padding:9px 10px;outline:0;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--uni);box-shadow:0 0 0 3px rgba(139,30,45,.12)}
.field input[readonly]{background:#f9fafb;color:#475467}
.field.check{flex-direction:row;align-items:center;gap:8px;padding-top:20px}
.field.check input{width:auto}
.login-card .field{margin-bottom:15px}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:800;font-size:13px}
.btn-sm{padding:5px 9px;font-size:11px}
.btn-primary{background:var(--uni);color:#fff}
.btn-primary:hover{background:var(--uni2)}
.btn-secondary{background:#eef1f4;color:#344054}
.btn-danger{background:#fdebed;color:#a62032}
.btn-success{background:#e8f5ee;color:#0f6b40}
.btn-warning{background:#fff4d8;color:#8a5600}
.btn-block{width:100%;padding:12px}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.form-grid.cols-6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span-2{grid-column:span 2}.span-3{grid-column:span 3}.span-4{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.items{margin-top:14px;border:1px dashed #d0d5dd;border-radius:10px;padding:12px;background:#fcfcfd}
.item-row{display:grid;grid-template-columns:130px repeat(5,minmax(0,1fr)) 40px;gap:8px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line)}
.item-row:last-child{border-bottom:0}
.item-row.simple{grid-template-columns:2fr 1fr 1fr 1fr 40px}
.item-row.lines{grid-template-columns:2fr 1fr 1fr 1.4fr 40px}

/* Layout */
.app{min-height:100vh;display:grid;grid-template-columns:276px 1fr}
.sidebar{background:#fff;border-right:1px solid var(--line);height:100vh;position:sticky;top:0;overflow:auto;padding:14px 12px;display:flex;flex-direction:column}
.sidebar .brand{padding:4px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.sidebar .brand-mark{width:44px;height:44px;color:var(--uni);font-size:15px}
.sidebar .brand-title{font-size:15px}
.sidebar .brand-sub{font-size:11px;color:var(--muted)}
.nav-group{margin:4px 0}
.nav-label{padding:8px 10px 4px;color:#98a2b3;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.nav{width:100%;border:0;background:transparent;border-radius:7px;text-align:left;padding:7px 10px;margin:1px 0;font-size:12.5px;font-weight:700;color:#475467}
.nav:hover{background:#faf4f5;color:var(--uni)}
.nav.active{background:var(--soft);color:var(--uni)}
.sidebar-bottom{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.userbox{padding:8px 10px}
.userbox b{display:block;font-size:12px}
.userbox span{font-size:11px;color:var(--muted)}
.main{min-width:0}
.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10;gap:10px}
.topbar h1{font-size:19px;margin:0}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{background:var(--soft);color:var(--uni);padding:7px 11px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}
.badge.closed{background:#1d2939;color:#fff}
.content{padding:24px;max-width:1500px;margin:0 auto}
.mobile-menu{display:none}

/* Tarjetas */
.hero{background:linear-gradient(135deg,#fff,#fff8f9);border:1px solid #ead7db;border-radius:16px;padding:22px 24px;margin-bottom:20px;box-shadow:var(--shadow)}
.hero h2{font-size:26px;margin:8px 0 6px}
.hero p{margin:0;color:var(--muted)}
.demo-chip{display:inline-flex;background:#f7e8eb;color:var(--uni);font-size:10px;font-weight:900;letter-spacing:.08em;padding:6px 9px;border-radius:999px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.kpi,.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.kpi{padding:18px}
.kpi-label{font-size:11px;font-weight:900;color:#667085;letter-spacing:.05em;text-transform:uppercase}
.kpi-value{font-size:24px;font-weight:900;margin:8px 0 4px}
.kpi-note{font-size:11px;color:#98a2b3}
.card{padding:18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:16px}
.card h4{margin:14px 0 8px;font-size:13px;color:#344054}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-head h3{margin:0}
.section-title{margin:0 0 4px;font-size:22px}
.section-sub{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.5}
.modules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.module{border:1px solid var(--line);border-radius:12px;padding:15px;background:#fff}
.module h4{margin:0 0 6px}
.module p{margin:0 0 12px;color:var(--muted);font-size:12px;line-height:1.5}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.split-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

/* Tablas */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:70vh}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border-bottom:1px solid var(--line);padding:8px 9px;font-size:12px;text-align:left;vertical-align:top}
th{background:#f9fafb;color:#475467;font-size:10px;letter-spacing:.04em;text-transform:uppercase;position:sticky;top:0;z-index:1}
tbody tr:hover{background:#fcf7f8}
td.money,th.money{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.total td{font-weight:900;background:#f9fafb}
tr.sub td{font-weight:800;background:#fcfcfd}
tr.group td{background:#f8ecef;color:var(--uni);font-weight:800}
tr.indent td:first-child{padding-left:26px}
td.nowrap{white-space:nowrap}
.pill{display:inline-flex;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800;background:#f2f4f7;color:#475467;white-space:nowrap}
.pill.ok{background:#e7f6ed;color:#12623b}
.pill.bad{background:#fdecee;color:#a62032}
.pill.warn{background:#fff4db;color:#845100}
.pill.info{background:#e8effa;color:#1d4f9a}
.pill.mod{background:#e7f6ed;color:#12623b}
.pill.moi{background:#fff4db;color:#845100}
.pill.adm{background:#e8effa;color:#1d4f9a}
.pill.ven{background:#f3e8fa;color:#6b2a8f}
.note{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:#475467;font-size:12px;line-height:1.55;margin-bottom:12px}
.danger-note{background:#fff1f2;border:1px solid #f4c7cd;color:#9f2334;border-radius:10px;padding:12px;margin-bottom:12px;font-size:12px}
.ok-note{background:#ecfdf3;border:1px solid #b7e4c7;color:#0f5132;border-radius:10px;padding:12px;margin-bottom:12px;font-size:12px}
.status{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.status:last-child{border-bottom:0}
.big-status{text-align:center;font-size:30px;font-weight:900;color:var(--uni);padding:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-weight:700;color:#475467;font-size:12px}
.tabs button.active{background:var(--soft);color:var(--uni);border-color:#ead7db}
.summary-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.summary-item{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-width:140px}
.summary-item span{display:block;font-size:10px;text-transform:uppercase;color:#667085;font-weight:800}
.summary-item b{display:block;margin-top:3px;font-size:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.toolbar .field{min-width:160px}
.empty{text-align:center;color:#98a2b3;padding:22px}
#toasts{position:fixed;right:22px;bottom:22px;z-index:100;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.toast{background:#1d2939;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:12px}
.toast.err{background:#a62032}

/* Cuentas T */
.t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.t-acc{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.t-title{text-align:center;font-weight:900;font-size:12px;padding:8px;border-bottom:2px solid var(--ink);background:#fafafa}
.t-title small{display:block;font-weight:600;color:var(--muted);font-size:10.5px}
.t-body{display:grid;grid-template-columns:1fr 1fr}
.t-col{padding:6px 8px;font-size:11.5px;font-variant-numeric:tabular-nums;min-height:40px}
.t-col:first-child{border-right:2px solid var(--ink)}
.t-col div{display:flex;justify-content:space-between;gap:6px;padding:1px 0}
.t-col div span{color:var(--muted)}
.t-foot{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);font-weight:900;font-size:11.5px}
.t-foot div{padding:5px 8px;text-align:right}
.t-saldo{text-align:center;font-size:11px;padding:5px;background:#f8ecef;color:var(--uni);font-weight:800}

/* Gráficos de barras */
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;font-size:12px}
.bar-track{height:18px;background:#f2f4f7;border-radius:6px;overflow:hidden;display:flex}
.bar-seg{height:100%}
.legend{display:flex;gap:14px;font-size:11px;color:#475467;margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* Estados financieros */
.fs{max-width:820px}
.fs-head{text-align:center;margin-bottom:14px}
.fs-head b{display:block;font-size:15px}
.fs-head span{display:block;font-size:12px;color:var(--muted)}

@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.modules{grid-template-columns:repeat(2,1fr)}.form-grid,.form-grid.cols-6{grid-template-columns:repeat(2,1fr)}.span-3,.span-4{grid-column:1/-1}.split,.split-3{grid-template-columns:1fr}.item-row,.item-row.simple,.item-row.lines{grid-template-columns:1fr 1fr}}
@media(max-width:780px){.login{grid-template-columns:1fr}.login-left{min-height:260px;padding:30px}.login-copy h1{font-size:30px}.login-right{padding:28px 18px}.app{display:block}.sidebar{position:fixed;left:-290px;z-index:40;width:276px;transition:.2s}.sidebar.open{left:0}.mobile-menu{display:inline-block}.topbar{padding:0 14px}.topbar .badge{display:none}.content{padding:16px}.kpis,.modules{grid-template-columns:1fr}.form-grid,.form-grid.cols-6{grid-template-columns:1fr}.span-2,.span-3,.span-4{grid-column:auto}.bar-row{grid-template-columns:90px 1fr 80px}}

@media print{
  .sidebar,.topbar,.no-print,.actions,.toolbar,.tabs,.btn{display:none!important}
  .app{display:block}.content{padding:0;max-width:none}
  .card,.kpi{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .table-wrap{max-height:none;overflow:visible;border:0}
  th{position:static}
  body{background:#fff}
}

/* Diálogos */
.modal-back{position:fixed;inset:0;background:rgba(16,24,40,.45);display:grid;place-items:center;z-index:200;padding:16px}
.modal{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:20px;max-width:460px;width:100%}
.modal p{margin:0 0 6px;font-size:14px;line-height:1.55;white-space:pre-line;color:var(--ink)}
.modal .actions{justify-content:flex-end}
.btn:focus-visible,.nav:focus-visible{outline:2px solid var(--uni);outline-offset:2px}

</style>
